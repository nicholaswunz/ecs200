project:
  type: book
  output-dir: _book
  

book:
  title: "ECS200 Research Methods in Ecology"
  subtitle: "School of Environmental and Conservation Sciences"
  author: "Nicholas Wu"
  date: today
  date-format: Do MMM YYYY
  page-navigation: true
  back-to-top-navigation: true
  search: true
  site-url: https://nicholaswu.quarto.pub/ecs200/
  repo-url: https://github.com/nicholaswunz/ECS200-Workshop
  sidebar: 
    logo: https://raw.githubusercontent.com/nicholaswunz/ECS200-Workshop/refs/heads/main/images/MU_wordmark_2021_red_RGB.jpg
  
  page-footer:
    border: true
    right: |
      This book was built with <a href="https://quarto.org/">Quarto</a>. This work is licensed under a [CC-BY-NC-ND 4.0 Int License](https://creativecommons.org/licenses/by-nc-nd/4.0/)
  
  
  favicon: images/MU_CREST_Red.png
  chapters:
    - index.qmd
    - R_intro.qmd
    - part: "Weeks"
      chapters:
      - week1_getting_started.qmd
      - week2_tidy_data.qmd
      - week3_diversity_index.qmd
      - week4_descriptive_stats.qmd
      - week5_inference.qmd
      - week6_nonparametric.qmd
      - week7_time_series.qmd
      - week8_multivariate.qmd
      - week9_spatial.qmd
      - week10_movement.qmd
      - week11_GLM.qmd
      - week12_random_effects.qmd
  appendices:
    - the_islands.qmd
    - research_design.qmd
    - references.qmd

bibliography: ./bib/references.bib
csl: ./bib/the-journal-of-experimental-biology.csl
link-citations: true

format:
  html:
    grid:
      body-width: 900px
    mainfont: Roboto
    monofont: Fira Code
    highlight-style: arrow
    monobackgroundcolor: "#F7F7F7"
    include-in-header: _fathom.html
    theme: 
      - theme.css
      - theme.scss
      - lumen

filters:
  - shinylive

fontsize: 98%;

#linkcolor: "#e12744" 
